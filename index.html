<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Override</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="terminal-history">
        <div class="log-entry">==================================================</div>
        <div class="log-entry">System lockdown is active.</div>
        <div class="log-entry">Every exit is sealed. Security is doing its thing.</div>
        <div class="log-entry">Need the command list? Type 'help'.</div>
        <div class="log-entry">==================================================</div>
    </div>

        <div id="input-container">
        <span id="terminal-prompt" class="prompt">system@lockdown:~$</span>
        <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script src="morestuff.js"></script>
</body>
</html>
